# Deploy Percona XtraDB Cluster 8.4 (MySQL 8.4 + Galera) as a SINGLE-NODE
# cluster on vm-1node (172.24.40.32), for DISTRIBUTED-DB-SCORING.md §3.2.1
# (單節點/低併發延遲) comparison against TiDB/CockroachDB/YugabyteDB on the
# same topology. IDC only — no GCP VM (cost control).
#
# Design note: a single-node Galera cluster is a standard, documented
# configuration — `wsrep_cluster_address=gcomm://` with an EMPTY host list
# means "start a new one-member Primary Component", and this is the
# permanent (not one-shot) value for this node. Unlike the multi-node
# galera-vm6.yml/galera-vm3.yml playbooks, there is no bootstrap→switch
# dance here: `gcomm://` alone is already the steady-state config for a
# single node, so this uses the regular `mysql.service` throughout.
#
# Inventory: ansible/inventory/vm1.ini ([vm1_db] = 172.24.40.32)
#
# Required environment variables (same 3-account model as galera-vm6.yml,
# see that file's header for full rationale — no hardcoded secrets):
#   GALERA_ADMIN_PASSWORD — root@'localhost'
#   GALERA_SST_PASSWORD   — sstuser@'localhost' (unused with 0 peers, but the
#                           [sst] config block still requires a value to be
#                           syntactically valid; kept for parity/future join)
#   GALERA_BENCH_PASSWORD — tpcc_bench@'%' (the account go-tpc uses)

- name: Sanity check required secret env vars
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert GALERA_*_PASSWORD env vars are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'GALERA_ADMIN_PASSWORD') | length > 0
          - lookup('env', 'GALERA_SST_PASSWORD') | length > 0
          - lookup('env', 'GALERA_BENCH_PASSWORD') | length > 0
        fail_msg: "Must export GALERA_ADMIN_PASSWORD, GALERA_SST_PASSWORD, GALERA_BENCH_PASSWORD before running this playbook."
      no_log: true

- name: Install and bootstrap Percona XtraDB Cluster 8.4 (vm-1node, single member)
  hosts: vm1_db
  become: true
  gather_facts: true
  vars:
    proxy_url: "http://sproxy.104-dev.com.tw:3128"
    galera_cluster_name: "galera-vm1"
    galera_admin_password: "{{ lookup('env', 'GALERA_ADMIN_PASSWORD') }}"
    galera_sst_password: "{{ lookup('env', 'GALERA_SST_PASSWORD') }}"
    galera_bench_password: "{{ lookup('env', 'GALERA_BENCH_PASSWORD') }}"
    galera_cluster_address: "gcomm://"
  tasks:
    # 2026-08-12 vm1/vm3 首次真實跑實測：這批 IDC 模板的 python3.12 沒裝
    # python3-dnf binding（ansible.builtin.dnf module 直接 fatal: "Could not
    # import the dnf python module"）——galera-vm6.yml 用的 crossregion 環境
    # 沒踩到這個問題，但不能假設所有 IDC 模板都一致。改用 raw dnf 指令（比照
    # tidb-vm1.yml 既有、已驗證可行的作法），完全繞開 python-dnf binding。
    - name: Install Percona release repo package
      ansible.builtin.command: dnf install -y --nogpgcheck https://repo.percona.com/yum/percona-release-latest.noarch.rpm
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_percona_release_install
      changed_when: "'Nothing to do' not in galera_percona_release_install.stdout"
      failed_when: galera_percona_release_install.rc != 0

    - name: Enable Percona XtraDB Cluster 8.4 repo
      ansible.builtin.command: percona-release setup -y pxc-84-lts
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_repo_setup
      changed_when: "'already' not in galera_repo_setup.stdout"
      failed_when: galera_repo_setup.rc != 0

    - name: Verify pxc-84-lts repo file was actually created
      ansible.builtin.stat:
        path: /etc/yum.repos.d/percona-pxc-84-lts-release.repo
      register: galera_repo_file
      failed_when: not galera_repo_file.stat.exists

    - name: Enable Percona XtraBackup 8.4 repo (separate from pxc-84-lts)
      ansible.builtin.command: percona-release enable pxb-84-lts release
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_pxb_repo_setup
      changed_when: "'already' not in galera_pxb_repo_setup.stdout"
      failed_when: galera_pxb_repo_setup.rc != 0

    - name: Verify pxb-84-lts repo file was actually created
      ansible.builtin.stat:
        path: /etc/yum.repos.d/percona-pxb-84-lts-release.repo
      register: galera_pxb_repo_file
      failed_when: not galera_pxb_repo_file.stat.exists

    - name: Disable EL8 built-in mysql module (avoid conflict with Percona packages)
      ansible.builtin.command: dnf module disable -y mysql
      register: galera_module_disable
      changed_when: "'Nothing to do' not in galera_module_disable.stdout"
      failed_when: galera_module_disable.rc != 0

    - name: Install Percona XtraDB Cluster + client + xtrabackup (SST)
      ansible.builtin.command: dnf install -y percona-xtradb-cluster percona-xtradb-cluster-client percona-xtrabackup-84 sysstat
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_pkg_install
      changed_when: "'Nothing to do' not in galera_pkg_install.stdout"
      failed_when: galera_pkg_install.rc != 0

    - name: Capture installed package NEVRA as evidence
      ansible.builtin.command: rpm -q percona-xtradb-cluster percona-xtradb-cluster-client percona-xtrabackup-84
      register: galera_pkg_nevra
      changed_when: false

    - name: Write package evidence file
      ansible.builtin.copy:
        dest: "/tmp/galera-pkg-nevra.txt"
        content: "{{ galera_pkg_nevra.stdout }}\n"
        mode: "0644"

    - name: OS tuning (swappiness / THP)
      ansible.builtin.shell: |
        set -e
        sysctl -w vm.swappiness=1
        echo "vm.swappiness = 1" > /etc/sysctl.d/99-galera.conf
        echo never > /sys/kernel/mm/transparent_hugepage/enabled
        echo never > /sys/kernel/mm/transparent_hugepage/defrag
      args:
        executable: /bin/bash
      changed_when: false

    - name: Preflight — capture SELinux enforcement mode (evidence, not gating)
      ansible.builtin.command: getenforce
      register: galera_selinux_mode
      changed_when: false
      failed_when: false

    - name: Label wsrep ports (20164-20166/tcp) as mysqld_port_t under SELinux enforcing/permissive
      ansible.builtin.command: semanage port -a -t mysqld_port_t -p tcp 20164-20166
      register: galera_semanage_add
      changed_when: "'already defined' not in (galera_semanage_add.stderr | default(''))"
      failed_when: >
        galera_semanage_add.rc != 0 and
        'already defined' not in (galera_semanage_add.stderr | default(''))
      when: galera_selinux_mode.stdout in ['Enforcing', 'Permissive']

    - name: Open wsrep ports (20164-20166/tcp) + MySQL client port (3306/tcp) on firewalld
      ansible.builtin.command: "{{ item }}"
      loop:
        - "firewall-cmd --permanent --add-port=20164-20166/tcp"
        - "firewall-cmd --permanent --add-port=3306/tcp"
        - "firewall-cmd --reload"
      register: galera_firewalld_active
      failed_when: false
      changed_when: galera_firewalld_active.rc == 0

    - name: Override wsrep settings (append to end of /etc/my.cnf — /etc/my.cnf.d/ is NOT included by this package)
      ansible.builtin.blockinfile:
        path: /etc/my.cnf
        marker: "# {mark} ANSIBLE MANAGED BLOCK — galera-vm1.yml wsrep override"
        insertafter: EOF
        block: |
          [mysqld]
          server_id={{ (ansible_default_ipv4.address.split('.')[-2:] | join('')) }}
          wsrep_on=ON
          wsrep_provider=/usr/lib64/galera4/libgalera_smm.so
          wsrep_cluster_address={{ galera_cluster_address }}
          wsrep_node_address={{ ansible_host | default(inventory_hostname) }}:20164
          wsrep_node_name={{ inventory_hostname }}
          wsrep_cluster_name={{ galera_cluster_name }}
          wsrep_provider_options="gmcast.listen_addr=tcp://0.0.0.0:20164;ist.recv_addr={{ ansible_host | default(inventory_hostname) }}:20165"
          pxc_encrypt_cluster_traffic=OFF
          wsrep_sst_method=xtrabackup-v2
          wsrep_sst_receive_address={{ ansible_host | default(inventory_hostname) }}:20166
          binlog_format=ROW
          # 2026-08-13 首次真實跑實測踩到的第六個 bug：這是單一節點（永遠不會有
          # 第二台跟它要 IST），binlog 純粹只寫不讀，卻沒設任何 purge 政策——
          # W=128 長時間 sustained write（單次 suite 需求約 2.5-3 小時）在
          # 100GB 磁碟上把 binlog 填爆到 92GB（72+ 個 1GB 檔案），導致後續
          # prepare/run 全部因磁碟滿而卡死。單節點沒有 IST 需求，用短保留窗即可。
          binlog_expire_logs_seconds=1800
          default_storage_engine=InnoDB
          innodb_autoinc_lock_mode=2
          innodb_buffer_pool_size=2G
          # 標準 TPC-C history 表無 explicit PK，理由與 galera-vm6.yml 相同
          pxc_strict_mode=PERMISSIVE
          bind_address=0.0.0.0

          [sst]
          wsrep_sst_auth=sstuser:{{ galera_sst_password }}
      register: galera_wsrep_cnf
      no_log: true

    - name: Check if datadir already initialized
      ansible.builtin.stat:
        path: /var/lib/mysql/ibdata1
      register: galera_datadir_stat

    - name: Archive pre-existing mysqld.log before fresh bootstrap
      ansible.builtin.command: >
        mv /var/log/mysqld.log
        /var/log/mysqld.log.pre-bootstrap.{{ ansible_date_time.iso8601_basic_short }}
      args:
        removes: /var/log/mysqld.log
      when: not galera_datadir_stat.stat.exists

    # 單節點 gcomm:// 就是最終穩態設定，不需要 galera-vm6.yml 那種
    # bootstrap-unit→切回 mysql.service 的兩階段流程，直接用一般
    # mysql.service 啟動即可自行 bootstrap 出一個 1-member Primary Component。
    - name: Start MySQL (self-bootstraps a 1-member cluster via gcomm://)
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true
      register: galera_start

    - name: Wait for MySQL port
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 3306
        timeout: 120

    - name: Extract temporary root password from log (first init only)
      ansible.builtin.shell: |
        grep -oP '(?<=temporary password is generated for root@localhost: ).*' /var/log/mysqld.log 2>/dev/null | tail -1 || true
      args:
        executable: /bin/bash
      register: galera_temp_pass
      changed_when: false
      no_log: true
      when: not galera_datadir_stat.stat.exists

    - name: Write temporary root auth defaults-file (avoids shell-quoting hazard)
      ansible.builtin.copy:
        dest: /root/.tmp-root-auth.cnf
        mode: "0600"
        content: |
          [client]
          user=root
          password="{{ galera_temp_pass.stdout }}"
      when:
        - not galera_datadir_stat.stat.exists
        - (galera_temp_pass.stdout | default('')) | length > 0
      no_log: true

    - name: Create Galera accounts (first init only)
      ansible.builtin.shell: |
        set -e
        rm -f /root/.account-setup-err.log
        if [ -f /root/.tmp-root-auth.cnf ]; then
          mysql --defaults-extra-file=/root/.tmp-root-auth.cnf --connect-expired-password -e "
            ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ galera_admin_password }}';
          " 2>>/root/.account-setup-err.log
          rm -f /root/.tmp-root-auth.cnf
        fi
        mysql -uroot -p'{{ galera_admin_password }}' -e "
          CREATE USER IF NOT EXISTS 'sstuser'@'localhost' IDENTIFIED BY '{{ galera_sst_password }}';
          ALTER USER 'sstuser'@'localhost' IDENTIFIED BY '{{ galera_sst_password }}';
          GRANT RELOAD, LOCK TABLES, PROCESS, REPLICATION CLIENT, BACKUP_ADMIN ON *.* TO 'sstuser'@'localhost';
          CREATE DATABASE IF NOT EXISTS tpcc;
          CREATE USER IF NOT EXISTS 'tpcc_bench'@'%' IDENTIFIED BY '{{ galera_bench_password }}';
          ALTER USER 'tpcc_bench'@'%' IDENTIFIED BY '{{ galera_bench_password }}';
          GRANT ALL PRIVILEGES ON tpcc.* TO 'tpcc_bench'@'%';
          GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'tpcc_bench'@'%';
          FLUSH PRIVILEGES;
        " 2>>/root/.account-setup-err.log
      args:
        executable: /bin/bash
      when: not galera_datadir_stat.stat.exists
      no_log: true

    - name: Verify wsrep_cluster_size = 1 and ready
      ansible.builtin.shell: |
        set -e
        size=$(mysql -uroot -p'{{ galera_admin_password }}' -N -B -e "SHOW STATUS LIKE 'wsrep_cluster_size';" 2>/dev/null | awk '{print $2}')
        ready=$(mysql -uroot -p'{{ galera_admin_password }}' -N -B -e "SHOW STATUS LIKE 'wsrep_ready';" 2>/dev/null | awk '{print $2}')
        if [ "$size" = "1" ] && [ "$ready" = "ON" ]; then
          echo "wsrep_cluster_size=1 wsrep_ready=ON"
          exit 0
        fi
        echo "unexpected: wsrep_cluster_size=$size wsrep_ready=$ready (expected 1/ON)"
        exit 1
      args:
        executable: /bin/bash
      no_log: true
      changed_when: false
