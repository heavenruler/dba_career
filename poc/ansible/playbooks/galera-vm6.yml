# Deploy Percona XtraDB Cluster 8.4 (MySQL 8.4 + Galera) vm-6node cross-region cluster
# (3 IDC + 3 GCP), for comparison against TiDB in the MySQL-compatible scoring group
# (see DISTRIBUTED-DB-SCORING.md §2.1/§4.1/§5.1).
#
# Design note (galera has no leader/lease concept, unlike TiDB/CRDB/YBDB):
#   Galera is synchronous multi-master replication — every node can accept writes,
#   there is no "placement policy" or "lease preference" to configure server-side.
#   The P-A vs P-B distinction for this DB therefore collapses entirely into the
#   CLIENT workload profile (which nodes the client talks to), not the cluster
#   deployment itself:
#     P-A × A-S : IDC client connects ONLY to idc-dbhost-1 (172.24.40.32) — single
#                 writer pattern, mirrors "leader pinned to IDC" semantics.
#     P-B × A-A : IDC client connects to idc-dbhost-1 AND GCP client connects to
#                 gcp-dbhost-1 (10.160.152.11) CONCURRENTLY — dual-writer pattern,
#                 mirrors "leader distributed across regions" semantics.
#   This playbook deploys the SAME 6-node cluster topology for both placements;
#   no re-deploy is needed between P-A and P-B runs, only the client script
#   invocation (run-vm6-suite.sh vs run-vm6-aa.sh) differs.
#
# Topology:
#   idc-dbhost-1 (172.24.40.32): PXC bootstrap node, entry point for P-A/P-B IDC side
#   idc-dbhost-2 (172.24.40.33): PXC node
#   idc-dbhost-3 (172.24.40.34): PXC node
#   gcp-dbhost-1 (10.160.152.11): PXC node, entry point for P-B GCP side
#   gcp-dbhost-2 (10.160.152.12): PXC node
#   gcp-dbhost-3 (10.160.152.13): PXC node
#
# Inventory: ansible/inventory/crossregion.ini (or crossregion-via31.ini)
#
# Required environment variables (2026-08-11, F-002 Codex review — no hardcoded
# secrets, no passwordless root; fail-fast if missing, never committed to repo):
#   GALERA_ADMIN_PASSWORD — root@'localhost' (ansible/deploy use only, Unix
#                           socket connections, never reachable over the network)
#   GALERA_SST_PASSWORD   — sstuser@'localhost' (xtrabackup SST internal auth only,
#                           go-tpc/benchmark clients never see or use this)
#   GALERA_BENCH_PASSWORD — tpcc_bench@'%' (the ONLY account benchmark clients use;
#                           scoped to tpcc.* only, reachable over network)
# Set these in your own shell before invoking `make phase-galera-deploy ...`
# (e.g. `export GALERA_ADMIN_PASSWORD=$(openssl rand -base64 24)` etc.) — they are
# read via Ansible's `lookup('env', ...)` below and asserted non-empty; the
# playbook aborts immediately if any is unset.
#
# Safety:
#   - 此 playbook 不修改 .31 (IDC TPC-C client) 上的任何 binary/config
#   - 不動既有 IDC haproxy (.20)；本測試不使用 haproxy（比照 CRDB/YBDB 直連模式）
#   - 三個密碼皆 no_log: true 保護，不會出現在 ansible 輸出/log/git diff 中

- name: Sanity check required secret env vars (F-002 — fail-fast, no defaults)
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Assert GALERA_*_PASSWORD env vars are set
      ansible.builtin.assert:
        that:
          - lookup('env', 'GALERA_ADMIN_PASSWORD') | length > 0
          - lookup('env', 'GALERA_SST_PASSWORD') | length > 0
          - lookup('env', 'GALERA_BENCH_PASSWORD') | length > 0
        fail_msg: "Must export GALERA_ADMIN_PASSWORD, GALERA_SST_PASSWORD, GALERA_BENCH_PASSWORD before running this playbook (F-002: no hardcoded secrets, no passwordless root)."
      no_log: true

- name: Install and bootstrap Percona XtraDB Cluster 8.4 on all 6 nodes
  hosts: 172.24.40.32,172.24.40.33,172.24.40.34,g-test-poc-1,g-test-poc-2,g-test-poc-3
  become: true
  gather_facts: true
  vars:
    proxy_url: "http://{{ 'gproxy' if region | default('idc') == 'gcp' else 'sproxy' }}.104-dev.com.tw:3128"
    galera_cluster_name: "galera-vm6"
    galera_admin_password: "{{ lookup('env', 'GALERA_ADMIN_PASSWORD') }}"
    galera_sst_password: "{{ lookup('env', 'GALERA_SST_PASSWORD') }}"
    galera_bench_password: "{{ lookup('env', 'GALERA_BENCH_PASSWORD') }}"
    # Static host map — keep symmetric with tidb_hosts in tidb-vm6.yml
    galera_hosts:
      - { id: idc-dbhost-1, ip: 172.24.40.32,  region: idc, bootstrap: true  }
      - { id: idc-dbhost-2, ip: 172.24.40.33,  region: idc, bootstrap: false }
      - { id: idc-dbhost-3, ip: 172.24.40.34,  region: idc, bootstrap: false }
      - { id: gcp-dbhost-1, ip: 10.160.152.11, region: gcp, bootstrap: false }
      - { id: gcp-dbhost-2, ip: 10.160.152.12, region: gcp, bootstrap: false }
      - { id: gcp-dbhost-3, ip: 10.160.152.13, region: gcp, bootstrap: false }
    # :20164 尾碼 = gmcast port（見下方 wsrep_provider_options 說明），必須
    # 明確帶埠號，否則 gcomm 預設嘗試 4567（不在防火牆白名單）。
    galera_cluster_address: "gcomm://{{ galera_hosts | map(attribute='ip') | map('regex_replace', '$', ':20164') | join(',') }}"
  tasks:
    - name: Install Percona release repo package
      ansible.builtin.dnf:
        name: https://repo.percona.com/yum/percona-release-latest.noarch.rpm
        state: present
        disable_gpg_check: true
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"

    # F-001（Codex review，依 Percona 官方 yum install 文件核對）：原本的
    # `pxc84` 不是有效 percona-release repo alias，正確值是 `pxc-84-lts`。
    #
    # 2026-08-11 首次真實跑修正：原本 failed_when 猜測 stdout 會包含
    # "pxc-84-lts" 字樣，實測發現 percona-release 的確認訊息只印通用文字
    # "Enabling the Percona Packaging Repository repository"，完全不回顯
    # alias 名稱——猜錯造成 6 台全部 false-positive fail-closed（repo 其實
    # 裝對了）。改成直接檢查 repo 檔案是否存在（實測檔名固定為
    # percona-pxc-84-lts-release.repo），這是可驗證的實際狀態，不是猜輸出格式。
    - name: Enable Percona XtraDB Cluster 8.4 repo
      ansible.builtin.command: percona-release setup -y pxc-84-lts
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_repo_setup
      changed_when: "'already' not in galera_repo_setup.stdout"
      failed_when: galera_repo_setup.rc != 0

    - name: Verify pxc-84-lts repo file was actually created
      ansible.builtin.stat:
        path: /etc/yum.repos.d/percona-pxc-84-lts-release.repo
      register: galera_repo_file
      failed_when: not galera_repo_file.stat.exists

    # 2026-08-11 首次真實跑發現：percona-xtrabackup-84 不在 pxc-84-lts repo 裡
    # （實測 dnf list available 查無此套件），xtrabackup 是獨立的 pxb-84-lts
    # repo（percona-release show 的 available repositories 清單裡有列）。用
    # `enable`（不是 `setup`）疊加開，setup 會關掉其他已開的 repo（我們還需要
    # 剛開的 pxc-84-lts 繼續開著）。
    - name: Enable Percona XtraBackup 8.4 repo (separate from pxc-84-lts)
      ansible.builtin.command: percona-release enable pxb-84-lts release
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_pxb_repo_setup
      changed_when: "'already' not in galera_pxb_repo_setup.stdout"
      failed_when: galera_pxb_repo_setup.rc != 0

    - name: Verify pxb-84-lts repo file was actually created
      ansible.builtin.stat:
        path: /etc/yum.repos.d/percona-pxb-84-lts-release.repo
      register: galera_pxb_repo_file
      failed_when: not galera_pxb_repo_file.stat.exists

    # EL8 modularity：內建 @mysql module（預設 8.0 stream）會跟 Percona 的
    # mysql-community-compatible RPM 檔名衝突，官方文件要求先 disable module
    # 再裝，否則 dnf install percona-xtradb-cluster 會報 "package conflicts
    # with mysql module" 或悄悄裝到 module 版而非 Percona 版。
    - name: Disable EL8 built-in mysql module (avoid conflict with Percona packages)
      ansible.builtin.command: dnf module disable -y mysql
      register: galera_module_disable
      changed_when: "'Nothing to do' not in galera_module_disable.stdout"
      failed_when: galera_module_disable.rc != 0

    - name: Install Percona XtraDB Cluster + client + xtrabackup (SST)
      ansible.builtin.dnf:
        name:
          - percona-xtradb-cluster
          - percona-xtradb-cluster-client
          - percona-xtrabackup-84
          - sysstat
        state: present
      environment:
        http_proxy: "{{ proxy_url }}"
        https_proxy: "{{ proxy_url }}"
      register: galera_pkg_install

    # 版本證據落地（不假設/不硬編任何版本號）——供 GALERA-EXECUTION-PLAN.md
    # 完成報告引用實際裝到的 NEVRA，而非 review 時假設的版本。
    - name: Capture installed package NEVRA as evidence
      ansible.builtin.command: rpm -q percona-xtradb-cluster percona-xtradb-cluster-client percona-xtrabackup-84
      register: galera_pkg_nevra
      changed_when: false

    - name: Write package evidence file on each node
      ansible.builtin.copy:
        dest: "/tmp/galera-pkg-nevra.txt"
        content: "{{ galera_pkg_nevra.stdout }}\n"
        mode: "0644"

    - name: OS tuning (swappiness / THP) — same as tidb-vm6.yml worker prep
      ansible.builtin.shell: |
        set -e
        sysctl -w vm.swappiness=1
        echo "vm.swappiness = 1" > /etc/sysctl.d/99-galera.conf
        echo never > /sys/kernel/mm/transparent_hugepage/enabled
        echo never > /sys/kernel/mm/transparent_hugepage/defrag
      args:
        executable: /bin/bash
      changed_when: false

    # F-007（Codex review）：wsrep 埠改到 20164-20166（見上方 galera_cluster_address
    # 註解）是「網路防火牆白名單」層級的修正；SELinux 是獨立的 host 層控制，
    # mysqld_t domain 預設只准 bind mysqld_port_t 標記過的埠（3306 内建有標，
    # 20164-20166 沒有）——即使網路防火牆已放行，SELinux enforcing 下 mysqld
    # 仍會被拒絕 bind 這三個埠，導致 wsrep 起不來。這裡只用 semanage port 對
    # 這三個埠做「精準例外」，不做 setenforce 0 全域關閉（Codex 明確要求不能
    # blanket disable SELinux）。
    - name: Preflight — capture SELinux enforcement mode (evidence, not gating)
      ansible.builtin.command: getenforce
      register: galera_selinux_mode
      changed_when: false
      failed_when: false

    - name: Label wsrep ports (20164-20166/tcp) as mysqld_port_t under SELinux enforcing/permissive
      ansible.builtin.command: semanage port -a -t mysqld_port_t -p tcp 20164-20166
      register: galera_semanage_add
      changed_when: "'already defined' not in (galera_semanage_add.stderr | default(''))"
      failed_when: >
        galera_semanage_add.rc != 0 and
        'already defined' not in (galera_semanage_add.stderr | default(''))
      when: galera_selinux_mode.stdout in ['Enforcing', 'Permissive']

    - name: Preflight — verify wsrep ports are labeled mysqld_port_t (evidence)
      ansible.builtin.command: semanage port -l
      register: galera_semanage_list
      changed_when: false
      when: galera_selinux_mode.stdout in ['Enforcing', 'Permissive']
      failed_when: >
        galera_selinux_mode.stdout in ['Enforcing', 'Permissive'] and
        '20164-20166' not in galera_semanage_list.stdout

    # firewalld 是 host 內部防火牆，跟 phase-crossregion 那層跨區網路防火牆
    # （fw-request R1-R9 白名單）是兩回事——網路層放行不代表 host 自己的
    # firewalld/iptables 也放行。只在 firewalld 真的在跑時才動它，不假設
    # 每台 host 都有裝/都在用 firewalld（fail-safe：偵測不到就跳過，留
    # pending runtime validation，而非盲目假設不存在就當作沒問題）。
    - name: Preflight — check if firewalld is active
      ansible.builtin.command: systemctl is-active firewalld
      register: galera_firewalld_active
      changed_when: false
      failed_when: false

    # 用 raw firewall-cmd（不依賴 ansible.posix collection 是否已裝在 .31 上——
    # Codex review 要求不確定的環境依賴要 fail-closed 查證，不能假設 collection
    # 存在）。--add-port 對已存在的 port 是 no-op（exit 0），天生 idempotent。
    - name: Open wsrep ports (20164-20166/tcp) + MySQL client port (3306/tcp) on firewalld
      ansible.builtin.command: "{{ item }}"
      loop:
        - "firewall-cmd --permanent --add-port=20164-20166/tcp"
        - "firewall-cmd --permanent --add-port=3306/tcp"
        - "firewall-cmd --reload"
      when: galera_firewalld_active.stdout == 'active'
      changed_when: true

    # Preflight（S2）：port 若已被「非 mysqld」process 佔用，SST/gmcast 會用
    # 不明確的 bind failure 炸掉——先在部署前就攔下來，比事後看 mysqld error
    # log 猜快。2026-08-11 修正：原本沒排除 mysqld 自己，導致對已部署健康
    # 叢集重跑（idempotent redeploy，如補 config 變更）時，看到自己合法在用
    # 的 port 就 false-positive fail-closed——改用 ss -ltnp 看 process 名稱，
    # 只有「非 mysqld 佔用」才算真衝突。
    - name: Preflight — verify wsrep ports (20164-20166) are not bound by a non-mysqld process
      ansible.builtin.shell: |
        set -o pipefail
        ss -ltnp 2>/dev/null | grep -E ':(20164|20165|20166)\s' | grep -v 'mysqld' || true
      args:
        executable: /bin/bash
      register: galera_port_conflict
      changed_when: false
      failed_when: galera_port_conflict.stdout != ''

    # 2026-08-11 首次真實跑實測找到的關鍵 bug：這個 PXC 8.4 rpm 套件出的
    # /etc/my.cnf 本身就是一個「自帶 wsrep 設定」的完整模板（含
    # wsrep_cluster_address=gcomm://、wsrep_node_name=pxc-cluster-node-1 等預設
    # 值），而且**沒有** `!includedir /etc/my.cnf.d` 這行——原本寫進
    # /etc/my.cnf.d/wsrep.cnf 的設定完全沒被讀到（`mysqld --print-defaults`
    # 證實 6 台全部仍在用 /etc/my.cnf 內建的預設值），導致每台都各自用空
    # gcomm:// 獨立開了一個 1-member 的 primary component，完全沒有真的互相
    # 連線——這正是先前「root 密碼在 5 台對不上」的根因（各自獨立 init，不是
    # SST 複製自 .32）。改用 blockinfile 直接把覆寫值加到 /etc/my.cnf 檔尾——
    # MySQL/Percona 的 ini 解析規則是同一個 [mysqld] section 內，後出現的
    # 同名參數蓋過前面的，所以整份 append 在檔尾能正確蓋掉檔案開頭已有的
    # wsrep_cluster_address / wsrep_node_name 等預設值，不需要冒險整份改寫
    # 覆蓋掉套件模板裡其他我們沒檢視過的既有設定。
    - name: Override wsrep settings (append to end of /etc/my.cnf — /etc/my.cnf.d/ is NOT included by this package)
      ansible.builtin.blockinfile:
        path: /etc/my.cnf
        marker: "# {mark} ANSIBLE MANAGED BLOCK — galera-vm6.yml wsrep override"
        insertafter: EOF
        block: |
          [mysqld]
          # 2026-08-11 自我複查抓到的 bug：原本用整個 IP 去點後截斷 9 碼算
          # server_id，GCP 三台（.11/.12/.13）只有最後一碼不同、恰好被截斷
          # 掉，三台全部撞成同一個 server_id（101601521）——MySQL/Galera
          # 要求 server_id 叢集內唯一，撞號會搞亂 binlog/GTID。改用最後兩個
          # octet（IDC：4032/4033/4034；GCP：15211/15212/15213，天生互不
          #相同，不需截斷）。
          server_id={{ (ansible_default_ipv4.address.split('.')[-2:] | join('')) }}
          wsrep_on=ON
          wsrep_provider=/usr/lib64/galera4/libgalera_smm.so
          # 2026-08-11 修正：專線 GCP→IDC 方向是逐埠白名單（見
          # phase-crossregion/SESSION-HISTORY.md 2026-07-03 節，fw-request
          # R1-R9 核准範圍：2379-2380/4000/5433/7000-7100/8080/9000-9100/
          # 10080/20160-20180/26257），Galera 預設的 wsrep 埠（gmcast 4567、
          # IST 4568、SST 4444）全部不在清單內——Galera 是雙向同步複寫，
          # GCP→IDC 方向若被擋，跨區複寫必定失敗（不像單向 replica 的架構
          # 還能單向堪用）。改把 gmcast/IST/SST 全部搬進 20160-20180
          # 這段已驗證雙向可通的範圍內（本次環境未部署 TiDB，整段閒置可用；
          # 比照 iperf3 埠 20170 的既有解法）。
          wsrep_cluster_address={{ galera_cluster_address }}
          wsrep_node_address={{ ansible_host | default(inventory_hostname) }}:20164
          wsrep_node_name={{ inventory_hostname }}
          wsrep_cluster_name={{ galera_cluster_name }}
          wsrep_provider_options="gmcast.listen_addr=tcp://0.0.0.0:20164;ist.recv_addr={{ ansible_host | default(inventory_hostname) }}:20165"
          # 2026-08-11 首次真實跑找到的第三個 bug：PXC 8.4 預設對 wsrep 節點間
          # 通訊開 TLS（"Passing config to GCS" dump 可見 socket.ssl = YES），
          # 但每台各自 --initialize 時獨立產生自己的自簽 CA/cert/key（彼此不
          # 互信），節點互連時在 TLS handshake 階段直接炸（mysqld.log 實測：
          # "tlsv1 alert decrypt error"）。正式產品環境該發真的共用 CA 憑證，
          # 但這是內網可信的 PoC 環境，用 Percona 官方就有提供的
          # pxc_encrypt_cluster_traffic=OFF 直接關掉 wsrep 通道 TLS，避開整套
          # 憑證派發複雜度（client-facing 3306 埠仍照常可用一般 SSL/TLS，
          # 這裡關的只是 wsrep gmcast/IST/SST 內部通道）。
          pxc_encrypt_cluster_traffic=OFF
          wsrep_sst_method=xtrabackup-v2
          wsrep_sst_receive_address={{ ansible_host | default(inventory_hostname) }}:20166
          binlog_format=ROW
          default_storage_engine=InnoDB
          innodb_autoinc_lock_mode=2
          innodb_buffer_pool_size=2G
          # 2026-08-11 首次真實跑 smoke 找到的第四個 bug：標準 TPC-C schema
          # 的 history 表按 spec 就是沒有 explicit primary key（go-tpc 產生
          # 的 schema 亦同，TiDB/CRDB/YBDB 三家都靠自己隱式 rowid 機制吃下這
          # 個設計，Galera 沒有這種隱式機制）。pxc_strict_mode=ENFORCING 會
          # 直接擋掉對無 PK 表的 DML（Error 1105），實測 prepare 階段插入
          # history 表 100% 失敗。改動 TPC-C schema 幫 history 加 PK 會讓
          # Galera 跑的資料模型跟其他三家不對等、破壞比較基礎；改用 Percona
          # 官方就有提供的 PERMISSIVE 模式——放行但記警告 log，不阻斷 DML，
          # 是官方文件對「schema 本來就沒 PK 但仍要用 Galera」情境的建議解法，
          # 不是關掉全部一致性檢查。
          pxc_strict_mode=PERMISSIVE
          bind_address=0.0.0.0

          # 2026-08-11 首次真實跑實測找到的第二個 bug：wsrep_sst_auth 放在
          # [mysqld] section 下，datadir 全新 --initialize 那一輪（Galera
          # provider 還沒真的載入，[Galera] 日誌顯示 "loading provider
          # library 'none'"）會把它當「未知變數」直接 ERROR abort（"unknown
          # variable 'wsrep_sst_auth=...'"，且錯誤訊息會把整行 value 一起印出
          # 到 mysqld.log——這正是這次意外把 SST 密碼印到終端機的源頭）。
          # Percona/Galera 官方文件的標準寫法是把 SST 專用認證放進獨立的
          # [sst] section（由 xtrabackup SST helper script 用
          # my_print_defaults --mysqld --defaults-group-suffix=sst 另外讀取，
          # 不經過 mysqld 自己的 [mysqld] 變數驗證），不受 --initialize 階段
          # provider 未載入的限制。
          [sst]
          wsrep_sst_auth=sstuser:{{ galera_sst_password }}
      register: galera_wsrep_cnf
      no_log: true  # F-002: content 內含 galera_sst_password，--diff 模式下不外洩

    - name: Check if datadir already initialized
      ansible.builtin.stat:
        path: /var/lib/mysql/ibdata1
      register: galera_datadir_stat

    # F-006（Codex review）：舊有 mysqld.log 若已存在，在全新 bootstrap 前先搬走
    # 存證，避免這次 init 的錯誤/SST log 跟前一輪殘留混在一起、事後追溯不清楚。
    # 只在「真的要重新 init datadir」時才搬（datadir 已存在＝重跑既有叢集，
    # 不動舊 log，維持現有服務不中斷）。
    - name: Archive pre-existing mysqld.log before fresh bootstrap
      ansible.builtin.command: >
        mv /var/log/mysqld.log
        /var/log/mysqld.log.pre-bootstrap.{{ ansible_date_time.iso8601_basic_short }}
      args:
        removes: /var/log/mysqld.log
      when:
        - inventory_hostname == '172.24.40.32'
        - not galera_datadir_stat.stat.exists

    # Bootstrap node (idc-dbhost-1) starts first with mysql@bootstrap.service
    # (PXC's systemd alias that forces wsrep_cluster_address=gcomm:// for this boot only).
    # F-006（Codex review）二處修正：
    #   1) enabled 明確設 false（不是 true）——mysql@bootstrap.service 只能開機當下
    #      這一次強制 gcomm://（空叢集）用，若被 enabled，下次系統重開機會用同一個
    #      unit 開機，等於每次重開都用空 gcomm:// 重新起一個獨立新叢集，把既有
    #      6-node 叢集資料丟掉/分裂成孤兒叢集。
    #   2) 加 datadir 未初始化才跑的 idempotency guard——重跑 playbook 時若叢集已在
    #      正常運作（用一般 mysql.service，不是 mysql@bootstrap.service），不該再
    #      對已有資料的節點重新bootstrap（會跟現有 mysql.service 搶 3306/wsrep 埠，
    #      或誤判成要重新開一個空叢集）。
    - name: Bootstrap first node (idc-dbhost-1 only, fresh init only)
      ansible.builtin.systemd:
        name: mysql@bootstrap.service
        state: started
        enabled: false
      when:
        - inventory_hostname == '172.24.40.32'
        - not galera_datadir_stat.stat.exists
      register: galera_bootstrap_start

    - name: Wait for bootstrap node MySQL port
      ansible.builtin.wait_for:
        host: 172.24.40.32
        port: 3306
        timeout: 120
      when: inventory_hostname == '172.24.40.32'

    - name: Extract temporary root password from bootstrap node log (first init only)
      ansible.builtin.shell: |
        grep -oP '(?<=temporary password is generated for root@localhost: ).*' /var/log/mysqld.log 2>/dev/null | tail -1 || true
      args:
        executable: /bin/bash
      register: galera_temp_pass
      changed_when: false
      no_log: true  # 2026-08-11 修正：本身就是密碼，先前漏加 no_log
      when:
        - inventory_hostname == '172.24.40.32'
        - not galera_datadir_stat.stat.exists

    # 2026-08-11 首次真實跑事故根因修正：MySQL 自動產生的 temp password 字元集
    # 遠比我們自己用 openssl rand -base64 產生的密碼寬（可能含 ' " \ $ 等 shell/SQL
    # 特殊字元），原本直接內插進 `-p'{{ galera_temp_pass.stdout }}'` 這種單引號
    # shell 字面值，temp password 一旦含單引號就會提早跳出引號、後面的字串被當
    # shell/SQL 語法解析，導致 account-creation 整個任務 fatal（且因為
    # no_log 看不到真正原因）。改用 --defaults-extra-file（純 ansible template
    # 渲染一次、MySQL ini parser 解析一次，完全不經過 shell 字串插值），繞開這
    # 整類問題。只有這個「MySQL 自產」的密碼需要這樣處理——後面 admin/sst/bench
    # 三組密碼是我們自己用 openssl rand -base64 產生，字元集只有 A-Za-z0-9+/=，
    # 對 shell 單引號/SQL 單引號都安全，維持原本 -p'...' 寫法不變。
    - name: Write temporary root auth defaults-file (avoids shell-quoting hazard from MySQL's auto-generated temp password)
      ansible.builtin.copy:
        dest: /root/.tmp-root-auth.cnf
        mode: "0600"
        content: |
          [client]
          user=root
          password="{{ galera_temp_pass.stdout }}"
      when:
        - inventory_hostname == '172.24.40.32'
        - not galera_datadir_stat.stat.exists
        - (galera_temp_pass.stdout | default('')) | length > 0
      no_log: true

    # 2026-08-11 修正（F-002，Codex review）：移除明碼密碼與 root 無密碼設計。
    # 三個帳號各司其職、密碼皆來自 required env var（見檔頭說明），一律
    # no_log: true 保護：
    #   root@'localhost'      — deployment admin，只給 ansible/本機 socket 用，
    #                           host='localhost' 天生不可跨網路連線
    #   sstuser@'localhost'   — xtrabackup SST 內部認證專用，go-tpc/benchmark
    #                           完全不會用到這個帳號；PXC 8.4/MySQL 8 的
    #                           xtrabackup backup lock 機制需要 BACKUP_ADMIN
    #                           （單純 RELOAD+LOCK TABLES+PROCESS+REPLICATION
    #                           CLIENT 在較新版本可能不足，官方文件見檔頭連結，
    #                           已加上以求 fail-safe，實際是否必要留待首次
    #                           real join 時觀察 SST log 驗證）
    #   tpcc_bench@'%'        — 唯一給 go-tpc/所有 benchmark client 使用的帳號，
    #                           權限收斂到 tpcc.* 而非全域 root，可跨網路連線
    #                           （P-A/P-B 設計本就需要 IDC/GCP client 各自連線）
    - name: Create Galera accounts + disable password policy (bootstrap node, first init only)
      ansible.builtin.shell: |
        set -e
        rm -f /root/.account-setup-err.log
        if [ -f /root/.tmp-root-auth.cnf ]; then
          # 2026-08-11 首次真實跑實測：這台 PXC 8.4 build 沒裝/沒啟用
          # validate_password component（SET GLOBAL validate_password.policy
          # 直接報 ERROR 1193 Unknown system variable），不是「裝了但太嚴」。
          # 我們的密碼本來就是 openssl rand -base64 24 高熵值，不需要放寬驗證
          # 規則，原本這兩行只是防禦性寫法，元件根本不存在時整段刪掉即可。
          mysql --defaults-extra-file=/root/.tmp-root-auth.cnf --connect-expired-password -e "
            ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ galera_admin_password }}';
          " 2>>/root/.account-setup-err.log
          rm -f /root/.tmp-root-auth.cnf
        fi
        mysql -uroot -p'{{ galera_admin_password }}' -e "
          CREATE USER IF NOT EXISTS 'sstuser'@'localhost' IDENTIFIED BY '{{ galera_sst_password }}';
          ALTER USER 'sstuser'@'localhost' IDENTIFIED BY '{{ galera_sst_password }}';
          GRANT RELOAD, LOCK TABLES, PROCESS, REPLICATION CLIENT, BACKUP_ADMIN ON *.* TO 'sstuser'@'localhost';
          CREATE DATABASE IF NOT EXISTS tpcc;
          CREATE USER IF NOT EXISTS 'tpcc_bench'@'%' IDENTIFIED BY '{{ galera_bench_password }}';
          ALTER USER 'tpcc_bench'@'%' IDENTIFIED BY '{{ galera_bench_password }}';
          GRANT ALL PRIVILEGES ON tpcc.* TO 'tpcc_bench'@'%';
          -- PROCESS + REPLICATION CLIENT 是 MySQL 內建的唯讀監控類權限（可看
          -- process list / SHOW STATUS 等，不授予任何 data 存取），root@'localhost'
          -- 只綁 Unix socket、gate/config-dump 腳本從 .31 跨網路連線碰不到，
          -- 但這兩支腳本需要跨區查 wsrep_* 狀態（F-005/F-010）——與其為此
          -- 多開一個第四組密碼，選擇把這兩個唯讀監控權限一併授權給 tpcc_bench，
          -- 而非退回 root 或給它額外的資料存取權。
          GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'tpcc_bench'@'%';
          FLUSH PRIVILEGES;
        " 2>>/root/.account-setup-err.log
      args:
        executable: /bin/bash
      when:
        - inventory_hostname == '172.24.40.32'
        - not galera_datadir_stat.stat.exists
      no_log: true

    # F-006（Codex review）：Ansible 預設 linear strategy 仍會對同一 task 平行
    # fork 到全部符合 when 的 host（5 台 joiner 同時 systemctl start），5 台
    # 同時對 donor 發起 SST 會讓 donor 網路/磁碟 I/O 瞬間打滿、彼此互搶頻寬拖慢
    # 全部 SST，最壞情況甚至撞 SST 逾時。加 throttle: 1 逼 5 台依序一台一台
    # join——`state: started` 對 Type=notify 的 mysqld unit 會等到 sd_notify
    # （SST 完成、server 真正 ready）才回傳，因此 throttle: 1 等同「等上一台
    # SST 完全跑完才開始下一台」，不只是限制 ansible fork 並發數而已。
    #
    # SST timeout（xtrabackup-v2 預設值是否夠用）：W=128 全量資料 SST 預估數
    # GB，實際所需時間取決於跨區頻寬與磁碟 I/O，本次未實跑無法量測——標記為
    # pending runtime validation，不憑空捏造具體秒數；wait_for timeout 先給
    # 600s（原 300s 對小 W 的 smoke 足夠，W=128 SST 是否夠留待首次 real join
    # 實測後再收斂）。
    - name: Start MySQL on remaining nodes (join via SST, one at a time)
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true
      when: inventory_hostname != '172.24.40.32'
      throttle: 1
      register: galera_join_start

    - name: Wait for MySQL port on all nodes
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 3306
        timeout: 600  # pending runtime validation for W=128 SST duration

    - name: Wait for wsrep_cluster_size = 6 on this node
      ansible.builtin.shell: |
        set -e
        for i in $(seq 1 60); do
          size=$(mysql -uroot -p'{{ galera_admin_password }}' -N -B -e \
            "SHOW STATUS LIKE 'wsrep_cluster_size';" 2>/dev/null | awk '{print $2}')
          ready=$(mysql -uroot -p'{{ galera_admin_password }}' -N -B -e \
            "SHOW STATUS LIKE 'wsrep_ready';" 2>/dev/null | awk '{print $2}')
          if [ "$size" = "6" ] && [ "$ready" = "ON" ]; then
            echo "wsrep_cluster_size=6 wsrep_ready=ON"
            exit 0
          fi
          sleep 5
        done
        echo "timeout: wsrep_cluster_size=$size wsrep_ready=$ready (expected 6/ON)"
        exit 1
      args:
        executable: /bin/bash
      no_log: true
      changed_when: false

    # 2026-08-11 首次真實跑實測補的第五個修正：mysql@bootstrap.service 是
    # 「這次開機強制 gcomm://（空叢集）」的一次性別名，永久留著跑不安全——
    # 之後任何需要重啟 .32（cold-reset、機器重開機、chaos node-restart）都會
    # 讓它用空 gcomm:// 重新 bootstrap 一個新叢集，把現有 6-node 叢集資料
    # 丟掉/分裂成孤兒叢集。官方建議做法：叢集確認組成（上面 wsrep_cluster_size
    # =6 已驗證）後，把 bootstrap 節點切換成一般 mysql.service——此時
    # wsrep_cluster_address 設定的 6-host 清單裡其他 5 台都已存活，一般
    # mysql.service 啟動會走正常 join（IST，不是 gcomm:// 空叢集 bootstrap）。
    # 順序很重要：兩個 unit 綁同一個 3306 port，必須先關掉 bootstrap 那個
    # 再啟動一般的，否則 mysql.service 會卡在 deactivating（實測踩過）。
    - name: Stop the one-time mysql@bootstrap.service unit on bootstrap node
      ansible.builtin.systemd:
        name: mysql@bootstrap.service
        state: stopped
        enabled: false
      when: inventory_hostname == '172.24.40.32'

    - name: Switch bootstrap node to regular mysql.service (cluster confirmed formed, rejoins via IST not gcomm:// bootstrap)
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true
      when: inventory_hostname == '172.24.40.32'
