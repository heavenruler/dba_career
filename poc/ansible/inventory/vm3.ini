[tpcc_client]
# ansible 一律從 .31 控制本身，target=tpcc_client 時改 local connection 避開
# self-ssh：2026-05-31 ybdb-leader-balance dispatch 踩到「Install ysqlsh on
# TPC-C client」→ Permission denied (self-ssh) → rc=4 表面失敗（cluster 已 ok）。
# 對 CRDB / YBDB playbook 同樣有「Install <db> CLI on tpcc_client」段，本修法
# (F-C) 一次解。
172.24.40.31 ansible_hostname=l-dbm-labroom-1 ansible_python_interpreter=/usr/bin/python3.12 ansible_connection=local

[haproxy]
# 2026-08-13：本機 ansible-core 已升級到 2.18.7，module_utils 用了
# `from __future__ import annotations`（需 Python 3.7+），這台 .20 原本只有
# python3.6，任何 ansible module（不只 setup）一律 SyntaxError fatal——這是
# ansible-core 版本漂移造成的既有相容性斷層，TiDB/CRDB/YBDB 的 haproxy 佈署
# 目前若重跑到這台一樣會炸，不是 galera 專屬問題。已在 .20 上額外裝
# python3.12（不動既有 python3.6），改指到這裡即可繼續共用同一份
# haproxy_deploy role，不需要為 legacy python 重寫 role。
172.24.47.20 ansible_hostname=l-monitor-labroom-1 ansible_python_interpreter=/usr/bin/python3.12
